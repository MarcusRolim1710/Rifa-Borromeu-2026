<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ícone da Capela São Carlos Borromeu</title>
  <desc id="desc">Ícone vetorial minimalista de uma capela de madeira iluminada à noite.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="1" stop-color="#18365b"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b431b"/>
      <stop offset=".5" stop-color="#c86c24"/>
      <stop offset="1" stop-color="#71300f"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35251f"/>
      <stop offset="1" stop-color="#17131a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffe8a3" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ffb52f" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff8b18" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-opacity=".42"/>
    </filter>
    <clipPath id="chapel">
      <path d="M72 292 L151 157 L362 157 L456 292 L456 399 L72 399 Z"/>
    </clipPath>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" rx="104" fill="url(#sky)"/>

  <!-- Estrelas -->
  <g fill="#fff">
    <circle cx="74" cy="89" r="2.2"/>
    <circle cx="123" cy="57" r="1.5"/>
    <circle cx="181" cy="92" r="1.8"/>
    <circle cx="239" cy="48" r="1.4"/>
    <circle cx="306" cy="79" r="2"/>
    <circle cx="383" cy="51" r="1.5"/>
    <circle cx="438" cy="108" r="2"/>
    <circle cx="51" cy="151" r="1.3"/>
    <circle cx="338" cy="126" r="1.3"/>
  </g>

  <!-- Lua/estrela discreta -->
  <circle cx="407" cy="103" r="18" fill="#fff6cf"/>
  <circle cx="414" cy="96" r="18" fill="#0c2040"/>

  <!-- Solo -->
  <path d="M34 399 Q180 376 282 394 T478 390 L478 444 L34 444 Z" fill="#9a6a3c" opacity=".55"/>
  <path d="M34 424 Q175 399 302 416 T478 410" fill="none" stroke="#d29a58" stroke-width="8" opacity=".7"/>

  <!-- Capela -->
  <g filter="url(#shadow)">
    <!-- telhado -->
    <path d="M54 299 L144 139 Q150 129 162 129 L361 129 Q373 129 381 140 L467 292 L452 305 L358 171 L157 171 L75 307 Z" fill="url(#roof)"/>
    <path d="M70 293 L151 155 L363 155 L451 293 L432 297 L354 177 L161 177 L91 301 Z" fill="url(#wood)"/>

    <!-- brilho interno -->
    <ellipse cx="269" cy="291" rx="170" ry="112" fill="url(#glow)"/>

    <!-- estrutura traseira -->
    <path d="M91 296 L161 177 L354 177 L432 296 L432 392 L91 392 Z" fill="#9b4c1c"/>

    <!-- interior -->
    <path d="M112 292 L169 190 L346 190 L414 292 L414 390 L112 390 Z" fill="#f5a02d" opacity=".82"/>

    <!-- bancos/interior escuro -->
    <path d="M124 330 H402 V389 H124 Z" fill="#5b2b14"/>
    <path d="M139 337 H194 V389 H139 Z M213 337 H268 V389 H213 Z M287 337 H342 V389 H287 Z M361 337 H398 V389 H361 Z" fill="#8c4319"/>

    <!-- vigas do telhado -->
    <g fill="#5c2b13">
      <path d="M151 166 H362 V181 H151 Z"/>
      <path d="M151 166 L84 293 H101 L166 181 Z"/>
      <path d="M362 166 L444 293 H426 L347 181 Z"/>
      <path d="M204 174 H220 V292 H204 Z"/>
      <path d="M274 174 H290 V292 H274 Z"/>
      <path d="M343 174 H359 V292 H343 Z"/>
    </g>

    <!-- pilares frontais -->
    <g fill="url(#wood)">
      <rect x="96" y="276" width="20" height="125" rx="3"/>
      <rect x="184" y="276" width="19" height="125" rx="3"/>
      <rect x="268" y="276" width="19" height="125" rx="3"/>
      <rect x="352" y="276" width="19" height="125" rx="3"/>
      <rect x="424" y="278" width="18" height="119" rx="3"/>
    </g>

    <!-- porta -->
    <rect x="111" y="284" width="70" height="117" rx="3" fill="#633015"/>
    <path d="M146 284 V401 M111 342 H181" stroke="#3d1e11" stroke-width="4"/>
    <circle cx="169" cy="346" r="4" fill="#e2ad55"/>

    <!-- luzes -->
    <g fill="#fff1b0">
      <circle cx="195" cy="256" r="7"/>
      <circle cx="271" cy="252" r="7"/>
      <circle cx="347" cy="260" r="7"/>
    </g>
    <g fill="#ffd45c" opacity=".35">
      <circle cx="195" cy="256" r="22"/>
      <circle cx="271" cy="252" r="22"/>
      <circle cx="347" cy="260" r="22"/>
    </g>

    <!-- vegetação simplificada -->
    <g fill="#234c2a">
      <circle cx="87" cy="391" r="28"/>
      <circle cx="116" cy="394" r="24"/>
      <circle cx="390" cy="393" r="28"/>
      <circle cx="420" cy="390" r="23"/>
      <circle cx="448" cy="398" r="20"/>
    </g>
    <g fill="#48783a">
      <circle cx="99" cy="386" r="10"/>
      <circle cx="402" cy="382" r="11"/>
      <circle cx="432" cy="391" r="9"/>
    </g>
  </g>

  <!-- Base -->
  <path d="M54 401 H458 L475 428 H39 Z" fill="#d29a58"/>
  <path d="M62 405 H450" stroke="#f1c47c" stroke-width="4" opacity=".7"/>

  <!-- pequena cruz no topo -->
  <g stroke="#f4d28a" stroke-width="7" stroke-linecap="round">
    <path d="M252 108 V139"/>
    <path d="M239 120 H265"/>
  </g>
</svg>
